[phases.setup]
# Adicionamos os comandos apt-get com a flag de retry antes dos pacotes Nix
cmds = [
    "apt-get clean",
    "apt-get -o Acquire::Retries=3 update"
]
nixPkgs = ["python311", "python311Packages.pip", "nodejs_23", "ffmpeg"]

[phases.build]
cmds = [
    "python3.11 -m venv /app/venv",
    "/app/venv/bin/pip install edge-tts",
    "npm install",
    "npm run build"
]

[start]
cmd = "PATH=/app/venv/bin:$PATH node server.js"